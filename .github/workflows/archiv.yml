name: langzeitarchiv

# WOECHENTLICH, SEIT 23.09.2026
# Vorher stand hier "kein Zeitplan, und das ist Absicht": die Historie
# aendere sich nicht mehr, der heutige Rand komme ohnehin aus
# data/market-log.json. Der zweite Teil stimmt, der erste nicht ganz. Das
# Archiv waechst am rechten Rand jeden Tag um einen Tag, und weil es nur
# von Hand lief, hing es am 22.09.2026 einen ganzen Monat hinterher
# (letzter Tag 21.08.2026). Die Seiten mussten deshalb ihre Tageszahl aus
# dem Log ziehen statt aus dem Archiv.
#
# Also Sonntag 03:00 UTC. Frueh genug, dass der Seitenstempel um 04:17
# schon das nachgezogene Archiv sieht, und weit weg vom Marktlogger um
# 21:23. Die Sperre unten teilt sich die Gruppe mit dem Stempel, es kann
# also ohnehin nie gleichzeitig geschrieben werden.
#
# Von Hand starten geht weiter, ueber Actions, links langzeitarchiv,
# rechts Run workflow.
#
# Der Lauf prueft am Ende selbst nach, wie viele Jahre je Feld wirklich
# im Archiv stehen, und faellt durch, wenn eines unter acht Jahren
# bleibt. Genau das ist am 23.08.2026 passiert, damals unbemerkt.

on:
  schedule:
    - cron: "0 3 * * 0"     # sonntag, 03:00 utc
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seitenstempel     # nie gleichzeitig mit dem Stempel schreiben
  cancel-in-progress: false

jobs:
  archivieren:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: selbsttest
        run: python3 scripts/history.py --selftest

      - name: historie holen
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python3 scripts/history.py --backfill

      # alle drei felder, nicht nur bitcoin. eine mehrjahresrendite ist
      # zur haelfte eine aussage ueber das startdatum, und das sieht man
      # erst, wenn mehrere spannen und mehrere anlagen nebeneinander
      # stehen.
      - name: probe gold
        if: always()
        run: python3 scripts/history.py --rueckblick --feld gld

      - name: probe aktien
        if: always()
        run: python3 scripts/history.py --rueckblick --feld spy

      - name: probe bitcoin
        if: always()
        run: python3 scripts/history.py --rueckblick --feld btc

      # auch wenn die historie zu kurz war, soll das was da ist im repo
      # landen. der lauf faerbt sich trotzdem rot, damit es auffaellt.
      - name: aendern und schieben
        if: always()
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "nichts geaendert, kein commit"
            exit 0
          fi
          git config user.name "pulsehawk bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "langzeitarchiv $(date -u +%Y-%m-%d)"
          git push
