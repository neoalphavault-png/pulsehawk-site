name: quellen pruefen
# Prueflauf fuer PulseHawk. Postet nichts, schreibt nichts ins Repo.
# Er druckt nur, welche Datenquellen fuer Gold, Aktien, Krypto und Waehrung
# aus einer GitHub Action heraus antworten. Der Schluessel wird nie gedruckt,
# das Skript meldet nur, ob einer gesetzt ist.
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: quellen abfragen
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python3 scripts/probe_sources.py
