name: seitenstempel

# Schreibt die Tageszahlen fest in den Quelltext der Datenseiten.
# Der Browser rechnet sie ohnehin, aber Antwortmaschinen lesen oft nur den
# rohen Quelltext und fuehren kein JavaScript aus. Ohne diesen Lauf saehen
# die fuer immer die Zahl vom Tag der Auslieferung.
#
# ZWEI TERMINE, UND DAS HAT EINEN GRUND
# Die zwei Zyklusseiten zaehlen Tage. Ihre Zahl wechselt um Mitternacht UTC,
# also will man frueh am Tag stempeln.
# Die Dominanzseite liest data/market-log.json. Der Marktlogger schreibt
# dort erst um 21:23 UTC hinein. Ein Lauf um 04:17 findet deshalb nur den
# Wert von gestern.
# Also beides. 04:17 macht die Tageszaehler frisch, 21:40 holt die Dominanz
# vom selben Tag nach.
#
# ⚠️ Fuer bitcoin-halving-to-top.html, bitcoin-top-to-bottom.html und
# bitcoin-dominance.html gilt ab jetzt dieselbe Regel wie fuer index.html im
# Repo kaspa-pulse. Niemals eine alte lokale Kopie hochladen, der Bot hat
# die Datei inzwischen veraendert.

on:
  schedule:
    - cron: "17 4 * * *"     # frueh, fuer die tageszaehler
    - cron: "40 21 * * *"    # nach dem marktlogger, fuer die dominanz
  workflow_dispatch:

permissions:
  contents: write

# Zwei Laeufe duerfen sich nie ueberschneiden. Zwei Commits innerhalb
# weniger Sekunden bringen die Auslieferung von GitHub Pages durcheinander,
# sie findet dann zwei Bauergebnisse und weiss nicht, welches gilt. Genau
# das ist am 21.08.2026 einmal passiert.
concurrency:
  group: seitenstempel
  cancel-in-progress: false

jobs:
  stempeln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: selbsttest
        run: python3 scripts/stamp_pages.py --selftest

      - name: stempeln
        run: python3 scripts/stamp_pages.py

      - name: aendern und schieben
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "nichts geaendert, kein commit"
            exit 0
          fi
          git config user.name "pulsehawk bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "seitenstempel $(date -u +%Y-%m-%d)"
          git push
