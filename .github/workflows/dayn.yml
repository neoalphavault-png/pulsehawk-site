name: day n

# Der taegliche Tagesbeitrag von PulseHawk, seit dem 16.09.2026.
#
# Bis dahin war das der Short des Tages (Routine 1 in pulse-studio
# docs/routinen.md). Der faellt weg. An seine Stelle tritt das, was ohnehin
# jeden Tag neu ist: der Tageszaehler seit dem Zyklushoch und der Abstand
# dazu. Zwei Schritte, beide ohne Hand.
#
#   1. Seitenstempel. Schreibt unter anderem LAST_CLOSE und LAST_DATE in
#      bitcoin-top-to-bottom.html aus data/market-log.json und committet.
#   2. Der Post auf @pulsehawkio mit der DAY-N-Zahl. scripts/day_n_post.py
#      liest dieselbe Datei und bricht ab, wenn Seite und Log sich
#      widersprechen.
#
# ZEITPUNKT: 07:30 UTC, seit dem 27.09.2026 (vorher 21:52). Der Zaehler
# zaehlt bis zum Tag des Laufs. Um 21:52 kam der Lauf mit GitHubs
# Verspaetung zwischen 23:35 und 00:18 an, also auf beiden Seiten von
# Mitternacht: 4 von 11 Laeufen kippten in den Folgetag, und jedes Kippen
# kostete einen Zaehltag oder liess ihn doppelt anfallen. Um 07:30 liegt
# der Lauf mitten im Tag, und der Kurs ist immer der vom Vorabend.
# Gerechnet gegen alle Laeufe des Marktloggers (20:00 UTC, gemessene
# Verspaetung bis 8:06 h): 07:30 haette keinen Tag gekostet, 00:30 einen.
# Morgens verspaetet GitHub staerker (Seitenstempel 04:17 startet 4:20 bis
# 5:36 h spaeter); der Post kommt deshalb eher gegen Mittag UTC.
# Er stempelt vor dem Post selbst noch einmal: findet er nichts, committet
# er nichts.
#
# Dieselbe concurrency group wie der Seitenstempel. Zwei Commits innerhalb
# weniger Sekunden bringen die Auslieferung von GitHub Pages durcheinander,
# das ist am 21.08.2026 einmal passiert.
#
# KOSTEN: ein Post ohne Link, 0,015 $ am Tag, rund 0,46 $ im Monat.
# Ab dem 24.09.2026 haengt eine Karte am Post. Ob X ein Bild gesondert
# abrechnet, ist HIER NICHT GEPRUEFT: dafuer braeuchte es einen echten
# Post mit Zugangsdaten, und der kostet Geld. Beide Enden sind gerechnet:
# wird das Bild nicht gesondert berechnet, bleibt es bei 0,46 $ im Monat;
# wuerde es wie ein Link mit 0,20 $ zaehlen, waeren es 6,00 $ im Monat.
# Beides liegt unter dem Spend Cap von 15 $, der ohne Auto-Recharge bleibt.
# Die Doppelpostsperre liegt in data/x-post-log.json (key dayn-<datum>);
# ein zweiter Lauf am selben Tag postet nicht noch einmal.

on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "nur rechnen und zeigen, nichts posten"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: seitenstempel
  cancel-in-progress: false

jobs:
  dayn:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Ohne Renderer keine Karte, und ohne Karte kein Post. Das hier
      # scheitert an einem benannten Schritt statt mitten im Postlauf.
      - name: renderer pruefen
        run: |
          python3 -c "import sys; sys.path.insert(0,'scripts'); \
            import dayn_grafik; print('renderer:', dayn_grafik.chrome())"

      - name: selbsttests
        run: |
          python3 scripts/stamp_pages.py --selftest
          python3 scripts/day_n_post.py --selftest
          python3 scripts/x_post.py --selftest
          python3 scripts/dayn_grafik.py --selftest
          python3 scripts/grafik_check.py --selftest

      - name: seiten stempeln
        run: python3 scripts/stamp_pages.py

      - name: stempel sichern
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "nichts geaendert, kein commit"
            exit 0
          fi
          git config user.name "pulsehawk bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "seitenstempel $(date -u +%Y-%m-%d) [day n]"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          echo "push fehlgeschlagen" >&2
          exit 1

      # Faellt X aus, wird der Lauf rot, aber der Stempel oben ist schon
      # gesichert. Das Sperrlog wird darunter in jedem Fall committet,
      # sonst verliert die Sperre ihr Gedaechtnis.
      - name: day n posten
        if: ${{ inputs.dry_run != true }}
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python3 scripts/day_n_post.py --post

      - name: nur zeigen
        if: ${{ inputs.dry_run == true }}
        run: python3 scripts/day_n_post.py --dry-run

      # Die Karte und die 390px-Vorschau des Laufs, damit ein Mensch
      # nachsehen kann, was rausgegangen ist. Sie liegen bewusst nicht im
      # Repo: taeglich 178 kB committen waere Laerm ohne Gewinn.
      - name: karte aufheben
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dayn-karte
          path: graphics/
          if-no-files-found: warn
          retention-days: 14

      - name: sperrlog sichern
        if: always()
        run: |
          git add data/x-post-log.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "sperrlog unveraendert"
            exit 0
          fi
          git config user.name "pulsehawk bot"
          git config user.email "actions@github.com"
          git commit -m "x post log $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          echo "push fehlgeschlagen" >&2
          exit 1
